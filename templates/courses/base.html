
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Online Course Management{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- TOP NAVBAR -->
    <nav class="navbar navbar-dark bg-primary px-4">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            <i class="bi bi-mortarboard-fill me-2"></i>
            Online Course Management
        </a>

        <span class="text-white">
            <i class="bi bi-person-circle me-1"></i>
            Admin Panel
        </span>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <aside class="col-md-2 sidebar p-3">

                <h6 class="text-uppercase text-secondary mb-3">
                    Main Menu
                </h6>

                <a href="{% url 'dashboard' %}" class="sidebar-link">
                    <i class="bi bi-grid me-2"></i>
                    Dashboard
                </a>

                <a href="{% url 'student_list' %}" class="sidebar-link">
                    <i class="bi bi-people me-2"></i>
                    Students
                </a>

                <a href="{% url 'instructor_list' %}" class="sidebar-link">
                    <i class="bi bi-person-badge me-2"></i>
                    Instructors
                </a>

                <a href="{% url 'course_list' %}" class="sidebar-link">
                    <i class="bi bi-book me-2"></i>
                    Courses
                </a>

                <a href="{% url 'enrollment_list' %}" class="sidebar-link">
                    <i class="bi bi-journal-check me-2"></i>
                    Enrollments
                </a>

                <a href="{% url 'available_courses' %}" class="sidebar-link">
                    <i class="bi bi-bookmark me-2"></i>
                    Available Courses
                </a>

                <!-- NEW: ENROLLED STUDENTS -->
                <a href="{% url 'enrolled_students' %}" class="sidebar-link">
                    <i class="bi bi-people-fill me-2"></i>
                    Enrolled Students
                </a>

            </aside>

            <!-- MAIN CONTENT -->
            <main class="col-md-10 p-4">

                {% block content %}
                {% endblock %}

            </main>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center py-3">
        <p class="mb-0">
            Online Course Management System
        </p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
